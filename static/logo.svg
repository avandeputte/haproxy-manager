<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 64" width="268" height="64"
     role="img" aria-label="haproxy-manager">
  <title>haproxy-manager</title>
  <!-- Mark plus wordmark, for the sign-in page and the README. The mark is
       icon.svg; the text uses a system stack so it matches the UI it sits in. -->
  <g>
    <rect width="64" height="64" rx="14" fill="#17242a"/>
    <g fill="none" stroke="#3ecfa8" stroke-width="4.5" stroke-linecap="round">
      <path d="M18 32 H31"/>
      <path d="M31 32 C39 32 39 16 47 16"/>
      <path d="M31 32 H47"/>
      <path d="M31 32 C39 32 39 48 47 48"/>
    </g>
    <circle cx="17" cy="32" r="6.5" fill="#f2f4f3"/>
    <g fill="#3ecfa8">
      <circle cx="47.5" cy="16" r="5"/>
      <circle cx="47.5" cy="32" r="5"/>
      <circle cx="47.5" cy="48" r="5"/>
    </g>
  </g>
  <!-- One text element with two spans: the gap between the words is the
       font's own, so it does not depend on guessing where "haproxy" ends in
       whatever font the viewer actually has. -->
  <text x="82" font-size="21"
        font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <tspan y="27" fill="#17242a" font-weight="700">haproxy</tspan>
    <tspan x="82" y="50" fill="#0e7c6b" font-weight="400">cluster manager</tspan>
  </text>
</svg>
