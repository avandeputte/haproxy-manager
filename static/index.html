<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAProxy Cluster Manager</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#17242a">
<link rel="stylesheet" href="/static/v/__VERSION__/css/app.css">
<script>
/* Before anything is painted. The preference is stored with the account, but
   waiting for the API to answer would show a light page for a moment first,
   which is exactly what someone choosing dark does not want to see. */
(function(){try{
  var want=localStorage.getItem("ham_theme")||"system";
  var dark=want==="dark"||(want==="system"&&
    window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme=dark?"dark":"light";
}catch(e){}})();
</script>
</head>
<body>
<aside id="nav">
  <div class="brand"><img src="/static/icon.svg" alt="" width="26" height="26">
    <span>haproxy<br><span class=brand2>cluster manager</span><small id="brandhost">&nbsp;</small></span></div>
  <div id="navlinks"></div>
  <div class="foot" id="whofoot"></div>
</aside>
<div id="main">
  <div id="topbar">
    <h1 id="pagetitle">Overview</h1>
    <div id="nodestrip"></div>
    <button class="btn pri" id="applybtn" title="Validate and write haproxy.cfg / keepalived.conf, then reload services">Apply</button>
  </div>
  <div id="banner"></div>
  <div id="content"></div>
</div>

<div id="login">
  <form id="loginbox" autocomplete="on">
    <img class="loginmark" src="/static/logo.svg" alt="haproxy-manager" width="204" height="38">
    <h2 id="logintitle">Sign in</h2>
    <p class="hint" id="loginintro">HAProxy Cluster Manager</p>
    <label for="lu">Username</label>
    <input id="lu" name="username" autocomplete="username" autofocus>
    <label for="lp">Password</label>
    <input id="lp" name="password" type="password" autocomplete="current-password">
    <div id="lp2wrap" hidden>
      <label for="lp2">Repeat password</label>
      <input id="lp2" type="password" autocomplete="new-password">
    </div>
    <button class="btn pri" id="lbtn" type="submit">Sign in</button>
    <div class="err" id="lerr"></div>
  </form>
</div>

<div id="ovl"><div id="dlg" role="dialog" aria-modal="true">
  <div class="hd"><h3 id="dlgtitle"></h3><button id="dlgclose" aria-label="Close">&times;</button></div>
  <div class="bd" id="dlgbody"></div>
  <div class="ft" id="dlgfoot"></div>
</div></div>

<script type="module" src="/static/v/__VERSION__/js/main.js"></script>
</body>
</html>
