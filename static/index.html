<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAProxy Manager</title>
<style>
:root{
  --petrol:#17242a;      /* sidebar */
  --petrol-2:#1f3038;    /* sidebar hover */
  --paper:#f2f4f3;       /* content background */
  --card:#ffffff;
  --ink:#1e2a2b;
  --mist:#647576;
  --hair:#d9e0de;
  --line:#0e7c6b;        /* primary action */
  --line-2:#0a5f52;
  --drift:#b26a00;       /* unapplied changes */
  --down:#b3402e;
  --up:#2e7d4f;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 var(--sans);color:var(--ink);background:var(--paper);display:flex;min-height:100vh}
a{color:var(--line)}
button{font:inherit;cursor:pointer}

/* ---- sidebar ---- */
#nav{width:232px;flex:0 0 232px;background:var(--petrol);color:#c8d4d2;display:flex;flex-direction:column}
#nav .brand{padding:18px 16px 14px;font:600 15px/1.3 var(--mono);color:#fff;letter-spacing:.02em;border-bottom:1px solid rgba(255,255,255,.08)}
#nav .brand small{display:block;font-weight:400;color:#7d918f;font-size:11px;margin-top:2px}
#nav .grp{font:600 10px/1 var(--mono);letter-spacing:.14em;color:#7d918f;padding:16px 16px 6px;text-transform:uppercase}
#nav button.grp{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;text-align:left;
  padding:14px 16px 8px;cursor:pointer;font:600 10px/1 var(--mono);letter-spacing:.14em;color:#7d918f;text-transform:uppercase}
#nav button.grp:hover{color:#c8d4d2}
#nav button.grp .caret{display:inline-block;width:8px;transition:transform .12s ease}
#nav button.grp[aria-expanded=true] .caret{transform:rotate(90deg)}
#nav button.grp .count{margin-left:auto;font-size:9px;opacity:.65}
#nav a.item{display:block;padding:7px 16px;color:#c8d4d2;text-decoration:none;font-size:13px;border-left:3px solid transparent}
#nav a.item:hover{background:var(--petrol-2)}
#nav a.item.on{background:var(--petrol-2);color:#fff;border-left-color:var(--line)}
#nav .foot{margin-top:auto;padding:12px 16px;border-top:1px solid rgba(255,255,255,.08)}
#nav .foot input{width:100%;background:#0f191e;border:1px solid #2c3e44;color:#dfe8e6;font:12px var(--mono);padding:6px 8px;border-radius:4px}
#nav .foot label{font:10px var(--mono);letter-spacing:.1em;color:#7d918f;text-transform:uppercase;display:block;margin-bottom:4px}

/* ---- main ---- */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--hair)}
#topbar h1{font:600 16px/1.2 var(--sans)}
#nodestrip{margin-left:auto;display:flex;align-items:center;gap:8px;font:12px var(--mono)}
.chip{padding:3px 9px;border-radius:4px;border:1px solid var(--hair);background:var(--paper)}
.chip.role-active{border-color:var(--up);color:var(--up)}
.chip.role-passive{border-color:var(--mist);color:var(--mist)}
.chip.role-standalone{border-color:var(--hair);color:var(--mist)}
.chip.drift{border-color:var(--drift);color:var(--drift)}
#content{padding:22px 24px;max-width:1140px;width:100%}
#banner{padding:12px 24px 0;max-width:1140px;width:100%}
#banner .ro{background:#f6ecdd;border:1px solid #e3cfa8;color:#7a4d00;border-radius:6px;padding:11px 14px;font-size:13px;display:flex;gap:12px;align-items:flex-start}
#banner .ro b{display:block;margin-bottom:2px}

/* ---- generic ---- */
.card{background:var(--card);border:1px solid var(--hair);border-radius:6px;margin-bottom:18px}
.card>.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.card>.hd h2{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
.card>.hd .sp{flex:1}
.card>.bd{padding:16px}
.hint{color:var(--mist);font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse}
th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mist);text-align:left;padding:8px 12px;border-bottom:1px solid var(--hair)}
td{padding:9px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
tr:last-child td{border-bottom:0}
td .sub{color:var(--mist);font-size:12px}
.mono{font-family:var(--mono);font-size:12.5px}
.empty{padding:26px 16px;color:var(--mist);text-align:center}
.btn{border:1px solid var(--hair);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:4px;font-size:13px}
.btn:hover{border-color:var(--mist)}
.btn.pri{background:var(--line);border-color:var(--line);color:#fff}
.btn.pri:hover{background:var(--line-2)}
.btn.warn{background:var(--drift);border-color:var(--drift);color:#fff}
.btn.dngr{color:var(--down);border-color:var(--hair)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font:12px var(--mono)}
.pill.up{background:#e4f1e9;color:var(--up)}
.pill.down{background:#f7e6e2;color:var(--down)}
.pill.off{background:#eceff0;color:var(--mist)}
.pill.warn{background:#f6ecdd;color:var(--drift)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.stat{border:1px solid var(--hair);border-radius:6px;padding:12px 14px;background:var(--card)}
.stat .k{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.stat .v{font:600 16px/1.3 var(--mono);margin-top:6px}
pre{font:12px/1.5 var(--mono);background:#0f191e;color:#d5e2e0;padding:14px;border-radius:6px;overflow:auto;max-height:60vh;white-space:pre-wrap}

/* ---- forms ---- */
.frm{display:grid;grid-template-columns:190px 1fr;gap:12px 16px;align-items:start}
.frm label.fl{font:600 12px var(--mono);color:var(--mist);padding-top:7px;text-align:right}
.frm input[type=text],.frm input[type=number],.frm input[type=password],.frm select,.frm textarea{
  width:100%;max-width:460px;padding:7px 9px;border:1px solid var(--hair);border-radius:4px;font:13px var(--sans);background:#fff;color:var(--ink)}
.frm textarea{font-family:var(--mono);font-size:12.5px;min-height:74px}
.frm input:focus,.frm select:focus,.frm textarea:focus,button:focus-visible{outline:2px solid var(--line);outline-offset:1px}
.ckbox{display:flex;align-items:center;gap:8px;padding-top:7px}
.cklist{border:1px solid var(--hair);border-radius:4px;max-width:460px;max-height:170px;overflow:auto;padding:6px 8px;background:#fff}
.cklist label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.cklist .none{color:var(--mist);font-size:12px;padding:2px}

/* ---- sign-in ---- */
#login{position:fixed;inset:0;background:var(--petrol);display:none;align-items:center;justify-content:center;padding:24px;z-index:30}
#login.show{display:flex}
#loginbox{background:var(--card);border-radius:8px;padding:26px 28px;width:100%;max-width:380px;display:flex;flex-direction:column}
#loginbox h2{font:600 17px var(--sans);margin-bottom:2px}
#loginbox .hint{margin-bottom:18px}
#loginbox label{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mist);margin-bottom:5px}
#loginbox input{padding:8px 10px;border:1px solid var(--hair);border-radius:4px;font:14px var(--sans);margin-bottom:14px;background:#fff;color:var(--ink)}
#loginbox button{margin-top:4px}
#loginbox .err{margin:12px 0 0;text-align:center}

/* ---- user footer ---- */
#nav .foot .who{font:12px var(--mono);color:#dfe8e6;overflow:hidden;text-overflow:ellipsis}
#nav .foot .who small{display:block;color:#7d918f;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
#nav .foot .lo{margin-top:9px;width:100%;background:#0f191e;border:1px solid #2c3e44;color:#c8d4d2;padding:5px;border-radius:4px;font-size:12px}
#nav .foot .lo:hover{border-color:#4a6068;color:#fff}

/* ---- modal ---- */
#ovl{position:fixed;inset:0;background:rgba(15,25,30,.55);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20}
#ovl.show{display:flex}
#dlg{background:var(--card);border-radius:8px;width:100%;max-width:760px;max-height:86vh;display:flex;flex-direction:column}
#dlg .hd{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--hair)}
#dlg .hd h3{font:600 14px var(--sans)}
#dlg .hd button{margin-left:auto;border:0;background:none;font-size:18px;color:var(--mist)}
#dlg .bd{padding:18px;overflow:auto}
#dlg .ft{padding:12px 18px;border-top:1px solid var(--hair);display:flex;gap:10px;justify-content:flex-end}
.err{color:var(--down);font-size:13px;margin-right:auto;align-self:center}

@media (max-width:840px){
  body{flex-direction:column}
  #nav{width:100%;flex:none}
  .frm{grid-template-columns:1fr}
  .frm label.fl{text-align:left;padding-top:0}
  #nodestrip{display:none}
}
@media (prefers-reduced-motion:no-preference){
  #dlg{animation:pop .12s ease-out}
  @keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<aside id="nav">
  <div class="brand">haproxy-manager<small id="brandhost">&nbsp;</small></div>
  <div id="navlinks"></div>
  <div class="foot" id="whofoot"></div>
</aside>
<div id="main">
  <div id="topbar">
    <h1 id="pagetitle">Overview</h1>
    <div id="nodestrip"></div>
    <button class="btn pri" id="applybtn" title="Validate and write haproxy.cfg / keepalived.conf, then reload services">Apply</button>
  </div>
  <div id="banner"></div>
  <div id="content"></div>
</div>

<div id="login">
  <form id="loginbox" autocomplete="on">
    <h2 id="logintitle">Sign in</h2>
    <p class="hint" id="loginintro">haproxy-manager</p>
    <label for="lu">Username</label>
    <input id="lu" name="username" autocomplete="username" autofocus>
    <label for="lp">Password</label>
    <input id="lp" name="password" type="password" autocomplete="current-password">
    <div id="lp2wrap" hidden>
      <label for="lp2">Repeat password</label>
      <input id="lp2" type="password" autocomplete="new-password">
    </div>
    <button class="btn pri" id="lbtn" type="submit">Sign in</button>
    <div class="err" id="lerr"></div>
  </form>
</div>

<div id="ovl"><div id="dlg" role="dialog" aria-modal="true">
  <div class="hd"><h3 id="dlgtitle"></h3><button onclick="closeDlg()" aria-label="Close">&times;</button></div>
  <div class="bd" id="dlgbody"></div>
  <div class="ft" id="dlgfoot"></div>
</div></div>

<script>
"use strict";
/* ============================ plumbing ============================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* The session cookie is set by /api/login and travels automatically. */
async function api(path,method="GET",body){
  const r=await fetch("/api/"+path,{method,headers:{"Content-Type":"application/json"},
    body:body!==undefined?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  if(r.status===401){showLogin();throw new Error(data.error||"Your session has expired -- sign in again.");}
  if(!r.ok)throw new Error(data.error||("HTTP "+r.status));
  return data;
}
function download(path){                       // let the browser save the response
  const a=document.createElement("a");a.href="/api/"+path;a.download="";
  document.body.appendChild(a);a.click();a.remove();
}
const lists={};                     // cache: "haproxy/servers" -> [...]
async function list(path,fresh){ if(fresh||!lists[path])lists[path]=await api(path); return lists[path]; }
function nameOf(path,id){const it=(lists[path]||[]).find(x=>x.id===id);return it?it.name:"?";}

/* ============================ modal ============================ */
function openDlg(title,bodyEl,buttons){
  $("#dlgtitle").textContent=title;
  const b=$("#dlgbody");b.innerHTML="";b.appendChild(bodyEl);
  const f=$("#dlgfoot");f.innerHTML="";
  (buttons||[]).forEach(x=>f.appendChild(x));
  $("#ovl").classList.add("show");
}
function closeDlg(){$("#ovl").classList.remove("show");}
$("#ovl").addEventListener("click",e=>{if(e.target.id==="ovl")closeDlg();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDlg();});
function btn(label,cls,fn){const b=document.createElement("button");b.className="btn "+(cls||"");b.textContent=label;b.onclick=fn;return b;}
function showText(title,text){const p=document.createElement("pre");p.textContent=text;openDlg(title,p,[btn("Close","",closeDlg)]);}

/* health check kinds, shared by the wizard and the Health Monitors page */
const HEALTH_LABEL={
  none:"none -- always considered up",
  tcp:"ping (TCP connect to the port)",
  http:"HTTP request",
  ssl:"TLS handshake",
  pgsql:"PostgreSQL login",
  mysql:"MariaDB / MySQL login",
};

/* ============================ entity registry ============================ */
/* Field types: text number bool select ref refmulti textarea password */
const E={
 "haproxy/servers":{title:"Real Servers",add:"Add server",
  intro:"The upstream hosts traffic is forwarded to. Attach them to Backend Pools.",
  cols:[["name","Name"],["address","Address",r=>esc(r.address)+":"+esc(r.port)],
        ["opts","Options",r=>[r.ssl?"ssl":"",r.backup?"backup":""].filter(Boolean).join(", ")||"—"],
        ["enabled","Enabled",r=>r.enabled!==false?"yes":"no"]],
  fields:[
   {k:"name",l:"Name",t:"text"},
   {k:"enabled",l:"Enabled",t:"bool",d:true},
   {k:"address",l:"Address",t:"text",h:"IP address or hostname of the real server"},
   {k:"port",l:"Port",t:"number"},
   {k:"weight",l:"Weight",t:"number",h:"Optional load-balancing weight (1-256)"},
   {k:"check_port",l:"Health check port",t:"text",h:"Optional. Leave empty to check the port traffic goes to."},
   {k:"ssl",l:"Encrypt to server (SSL)",t:"bool"},
   {k:"ssl_verify",l:"Verify server certificate",t:"bool"},
   {k:"backup",l:"Backup server",t:"bool",h:"Only receives traffic when all non-backup servers are down"},
   {k:"description",l:"Description",t:"text"}]},

 "haproxy/backends":{title:"Backend Pools",add:"Add pool",
  intro:"Groups of Real Servers with a balancing algorithm, health checks and persistence.",
  cols:[["name","Name"],["mode","Mode"],["balance","Balance",r=>r.balance||"roundrobin"],
        ["servers","Servers",r=>(r.servers||[]).map(id=>esc(nameOf("haproxy/servers",id))).join(", ")||"—"],
        ["hc","Check",r=>r.healthcheck_enabled?esc(nameOf("haproxy/healthchecks",r.healthcheck)):"off"]],
  refs:["haproxy/servers","haproxy/healthchecks"],
  fields:[
   {k:"name",l:"Name",t:"text"},
   {k:"enabled",l:"Enabled",t:"bool",d:true},
   {k:"mode",l:"Mode",t:"select",o:["http","tcp"],d:"http"},
   {k:"balance",l:"Balance algorithm",t:"select",o:["roundrobin","leastconn","source","static-rr","uri"],d:"roundrobin"},
   {k:"servers",l:"Servers",t:"refmulti",ref:"haproxy/servers"},
   {k:"healthcheck_enabled",l:"Enable health checking",t:"bool"},
   {k:"healthcheck",l:"Health Monitor",t:"ref",ref:"haproxy/healthchecks"},
   {k:"persistence",l:"Persistence",t:"select",o:["none","cookie","source"],d:"none",h:"cookie = HTTP only; source = stick table on the client IP, the usual choice for TCP"},
   {k:"cookie_name",l:"Cookie name",t:"text",h:"Defaults to SRVID"},
   {k:"stick_type",l:"Stick table type",t:"select",o:["ip","ipv6"],d:"ip",h:"HAProxy spells the IPv4 type \"ip\"; \"ipv4\" is not valid"},
   {k:"stick_size",l:"Stick table size",t:"text",h:"For source persistence, e.g. 50k"},
   {k:"stick_expire",l:"Stick table expiry",t:"text",h:"For source persistence, e.g. 30m"},
   {k:"log_health_checks",l:"Log health check changes",t:"bool",h:"option log-health-checks"},
   {k:"custom",l:"Extra directives",t:"textarea",h:"Advanced. Raw lines added inside this backend, for anything the fields above do not cover -- for example \"http-reuse safe\". One per line. See the HAProxy configuration manual: https://docs.haproxy.org/2.6/configuration.html"}]},

 "haproxy/frontends":{title:"Public Services",add:"Add service",
  intro:"Listening sockets clients connect to (frontends). Certificates come from ACME > Certificates.",
  cols:[["name","Name"],["binds","Listen on",r=>"<span class=mono>"+esc((r.binds||"").split("\n").filter(Boolean).join(", "))+"</span>"],
        ["mode","Mode",r=>esc(r.mode||"http")+(r.ssl_enabled?" +ssl":"")],
        ["be","Default pool",r=>r.default_backend?esc(nameOf("haproxy/backends",r.default_backend)):"—"],
        ["enabled","Enabled",r=>r.enabled!==false?"yes":"no"]],
  refs:["haproxy/backends","haproxy/rules","acme/certificates"],
  fields:[
   {k:"name",l:"Name",t:"text"},
   {k:"enabled",l:"Enabled",t:"bool",d:true},
   {k:"binds",l:"Listen addresses",t:"textarea",h:"One per line, e.g. 0.0.0.0:80 or the shared VIP such as 192.0.2.10:443"},
   {k:"mode",l:"Mode",t:"select",o:["http","tcp"],d:"http"},
   {k:"ssl_enabled",l:"Enable SSL offloading",t:"bool"},
   {k:"certificates",l:"Certificates",t:"refmulti",ref:"acme/certificates",h:"First certificate is the default; SNI selects among the rest"},
   {k:"http2",l:"Enable HTTP/2",t:"bool"},
   {k:"forwardfor",l:"Add X-Forwarded-For",t:"bool",d:true},
   {k:"http_to_https",l:"Redirect HTTP to HTTPS",t:"bool",h:"For plain HTTP services on port 80. ACME challenge requests are never redirected."},
   {k:"default_backend",l:"Default Backend Pool",t:"ref",ref:"haproxy/backends"},
   {k:"rules",l:"Rules",t:"refmulti",ref:"haproxy/rules",h:"Applied in the order shown here (the order of the Rules list)"},
   {k:"custom",l:"Extra directives",t:"textarea",h:"Advanced. Raw lines added inside this frontend, for anything the fields above do not cover. One per line. See the HAProxy configuration manual: https://docs.haproxy.org/2.6/configuration.html"}]},

 "haproxy/conditions":{title:"Conditions",add:"Add condition",
  intro:"Named tests (ACLs) evaluated against traffic. Combine them in Rules.",
  cols:[["name","Name"],["type","Type"],["value","Value",r=>"<span class=mono>"+esc((r.param?r.param+" = ":"")+(r.value||""))+"</span>"],
        ["negate","Negate",r=>r.negate?"yes":"no"]],
  fields:[
   {k:"name",l:"Name",t:"text"},
   {k:"type",l:"Condition type",t:"select",o:["host_matches","host_starts_with","host_ends_with","path_matches","path_starts_with","path_ends_with","path_contains","url_parameter","http_header","source_ip","ssl_sni","custom"],d:"host_matches"},
   {k:"param",l:"Header / parameter name",t:"text",h:"Only for the http_header and url_parameter types"},
   {k:"value",l:"Value",t:"text",h:"For type custom: a raw ACL expression"},
   {k:"negate",l:"Negate",t:"bool"},
   {k:"description",l:"Description",t:"text"}]},

 "haproxy/rules":{title:"Rules",add:"Add rule",
  intro:"Actions taken when Conditions match: select a pool, redirect, set headers, deny.",
  cols:[["name","Name"],["type","Action"],
        ["cond","Conditions",r=>(r.conditions||[]).map(id=>esc(nameOf("haproxy/conditions",id))).join(", ")||"always"],
        ["tgt","Target",r=>r.type==="use_backend"?esc(nameOf("haproxy/backends",r.backend)):esc([r.param1,r.param2].filter(Boolean).join(" "))||"—"]],
  refs:["haproxy/conditions","haproxy/backends"],
  fields:[
   {k:"name",l:"Name",t:"text"},
   {k:"type",l:"Action",t:"select",o:["use_backend","redirect_scheme_https","redirect_location","http_request_deny","http_request_set_header","http_request_del_header","http_response_set_header","tcp_request_content_accept","tcp_request_content_reject","custom"],d:"use_backend"},
   {k:"test",l:"Apply when",t:"select",o:["if","unless"],d:"if"},
   {k:"operator",l:"Combine conditions with",t:"select",o:["and","or"],d:"and"},
   {k:"conditions",l:"Conditions",t:"refmulti",ref:"haproxy/conditions",h:"Leave empty to apply unconditionally"},
   {k:"backend",l:"Backend Pool",t:"ref",ref:"haproxy/backends",h:"Only for the use_backend action"},
   {k:"param1",l:"Name / location / raw line",t:"text"},
   {k:"param2",l:"Value",t:"text"}]},

 "haproxy/healthchecks":{title:"Health Monitors",add:"Add monitor",
  intro:"How Backend Pools decide whether a Real Server is alive.",
  cols:[["name","Name"],["type","Type",r=>esc(HEALTH_LABEL[r.type]||r.type)],
        ["interval","Interval",r=>r.interval||"2s"],
        ["det","Detail",r=>r.type==="http"?"<span class=mono>"+esc((r.http_method||"GET")+" "+(r.http_uri||"/")+(r.expect_status?" -> "+r.expect_status:""))+"</span>"
              :(r.type==="pgsql"||r.type==="mysql")?"<span class=mono>user "+esc(r.db_user||"")+"</span>":"—"]],
  fields:[
   {k:"name",l:"Name",t:"text"},
   {k:"type",l:"Type",t:"select",o:["tcp","http","ssl","pgsql","mysql"],d:"tcp"},
   {k:"interval",l:"Check interval",t:"text",h:"e.g. 2s"},
   {k:"http_method",l:"HTTP method",t:"select",o:["GET","HEAD","OPTIONS"],d:"GET"},
   {k:"http_uri",l:"HTTP request URI",t:"text",h:"e.g. /health"},
   {k:"expect_status",l:"Expected status",t:"text",h:"e.g. 200"},
   {k:"db_user",l:"Database user",t:"text",h:"For the PostgreSQL and MySQL/MariaDB checks. Only the login handshake is performed -- no password is sent, so an account with no privileges is enough."},
   {k:"mysql_post41",l:"MySQL 4.1+ authentication",t:"bool",d:true,h:"Leave on for MariaDB and any modern MySQL"}]},

 "acme/accounts":{title:"Accounts",add:"Add account",
  intro:"ACME accounts used to request certificates.",
  cols:[["name","Name"],["email","E-mail"],["ca","CA"]],
  fields:[
   {k:"name",l:"Name",t:"text"},
   {k:"email",l:"E-mail address",t:"text"},

/* ============================ form rendering ============================ */
/* An open dialog owns the fields it shows. Page forms and dialog forms use the
   same f_<key> ids, and document.getElementById returns whichever comes first
   in the document -- which is the page, not the dialog on top of it. */
function fieldEl(k){
  const ovl=$("#ovl");
  if(ovl&&ovl.classList.contains("show")){
    const inDlg=$("#dlg").querySelector('[data-field="'+k+'"]');
    if(inDlg)return inDlg;
  }
  return document.querySelector('#content [data-field="'+k+'"]')||document.getElementById("f_"+k);
}
function fieldRow(f,val){
  const lab=document.createElement("label");lab.className="fl";lab.textContent=f.l;lab.htmlFor="f_"+f.k;
  const cell=document.createElement("div");
  let inp;
  if(f.t==="bool"){
    const wrap=document.createElement("div");wrap.className="ckbox";
    inp=document.createElement("input");inp.type="checkbox";inp.id="f_"+f.k;inp.dataset.field=f.k;
    inp.checked=val!==undefined?!!val:!!f.d;
    wrap.appendChild(inp);cell.appendChild(wrap);
  }else if(f.t==="select"){
    inp=document.createElement("select");inp.id="f_"+f.k;inp.dataset.field=f.k;
    /* options are plain strings, or {value,label} for things with an id */
    const opts=(typeof f.o==="function"?f.o():f.o)||[];
    const valOf=o=>(o&&typeof o==="object")?o.value:o;
    opts.forEach(o=>{
      const op=document.createElement("option");
      op.value=valOf(o);
      op.textContent=(o&&typeof o==="object")?(o.label??o.value):o;
      inp.appendChild(op);
    });
    inp.value=val??f.d??(opts.length?valOf(opts[0]):"");
    cell.appendChild(inp);
  }else if(f.t==="ref"){
    inp=document.createElement("select");inp.id="f_"+f.k;inp.dataset.field=f.k;
    const none=document.createElement("option");none.value="";none.textContent="(none)";inp.appendChild(none);
    (lists[f.ref]||[]).forEach(it=>{const op=document.createElement("option");op.value=it.id;op.textContent=it.name;inp.appendChild(op);});
    inp.value=val||"";cell.appendChild(inp);
  }else if(f.t==="refmulti"){
    inp=document.createElement("div");inp.className="cklist";inp.id="f_"+f.k;inp.dataset.field=f.k;inp.dataset.refmulti="1";
    const items=lists[f.ref]||[];
    if(!items.length){const d=document.createElement("div");d.className="none";d.textContent="Nothing defined yet.";inp.appendChild(d);}
    items.forEach(it=>{
      const l=document.createElement("label");
      const c=document.createElement("input");c.type="checkbox";c.value=it.id;
      c.checked=(val||[]).includes(it.id);
      l.appendChild(c);l.appendChild(document.createTextNode(it.name));inp.appendChild(l);
    });
    cell.appendChild(inp);
  }else if(f.t==="combo"){
    /* a list to pick from that still accepts anything typed */
    inp=document.createElement("input");inp.type="text";inp.id="f_"+f.k;inp.dataset.field=f.k;inp.value=val??"";
    inp.autocomplete="off";inp.setAttribute("list","dl_"+f.k);
    const dl=document.createElement("datalist");dl.id="dl_"+f.k;
    (typeof f.o==="function"?f.o():(f.o||[])).forEach(o=>{
      const op=document.createElement("option");
      op.value=(o&&o.value!==undefined)?o.value:o;
      if(o&&o.label)op.label=o.label;
      dl.appendChild(op);
    });
    cell.appendChild(inp);cell.appendChild(dl);
  }else if(f.t==="textarea"){
    inp=document.createElement("textarea");inp.id="f_"+f.k;inp.dataset.field=f.k;inp.value=val??"";cell.appendChild(inp);
  }else{
    inp=document.createElement("input");inp.type=f.t==="password"?"password":(f.t==="number"?"number":"text");
    inp.id="f_"+f.k;inp.dataset.field=f.k;inp.value=val??(f.d??"");
    if(f.t==="password")inp.autocomplete="new-password";
    cell.appendChild(inp);
    /* Secrets you have to move to another machine need to be readable. */
    if(f.t==="password"&&f.reveal){
      const bar=document.createElement("div");bar.style.marginTop="7px";
      const note=document.createElement("span");note.className="sub";note.style.marginLeft="8px";
      const toggle=btn("Show","sm",()=>{
        const hidden=inp.type==="password";
        inp.type=hidden?"text":"password";
        toggle.textContent=hidden?"Hide":"Show";
      });
      bar.appendChild(toggle);
      bar.appendChild(document.createTextNode(" "));
      bar.appendChild(btn("Copy","sm",async()=>{
        if(!inp.value){note.textContent="nothing to copy";return;}
        try{
          await navigator.clipboard.writeText(inp.value);
          note.textContent="copied";
        }catch(e){
          // clipboard access needs a secure context; fall back to selecting it
          const was=inp.type;inp.type="text";inp.focus();inp.select();
          note.textContent="selected -- press "+(navigator.platform.indexOf("Mac")>=0?"Cmd":"Ctrl")+"+C";
          if(was==="password")toggle.textContent="Hide";
        }
        setTimeout(()=>{note.textContent="";},4000);
      }));
      if(f.generate){
        bar.appendChild(document.createTextNode(" "));
        bar.appendChild(btn("Generate","sm",()=>{
          const a=new Uint8Array(24);crypto.getRandomValues(a);
          inp.value=[...a].map(x=>x.toString(16).padStart(2,"0")).join("");
          inp.type="text";toggle.textContent="Hide";
          inp.dispatchEvent(new Event("input"));
        }));
      }
      // The node still checks the SAVED key, so an edited field is a trap:
      // copy it to another node and that node will present the wrong value.
      const saved=inp.value;
      const warn=document.createElement("div");warn.className="hint";
      warn.style.cssText="margin-top:6px;color:var(--drift)";
      inp.addEventListener("input",()=>{
        warn.textContent=inp.value!==saved
          ? "This key has not been saved yet. Press Save before copying it to another node -- "+
            "until then this node still expects the previous key."
          : "";
      });
      cell.appendChild(warn);
      bar.appendChild(note);
      cell.appendChild(bar);
    }
  }
  if(f.h){const h=document.createElement("div");h.className="hint";h.textContent=f.h;cell.appendChild(h);}
  return [lab,cell];
}
function readForm(fields){
  const out={};
  fields.forEach(f=>{
    const el=fieldEl(f.k);
    if(f.t==="bool")out[f.k]=el.checked;
    else if(f.t==="refmulti")out[f.k]=[...el.querySelectorAll("input:checked")].map(c=>c.value);
    else if(f.t==="number")out[f.k]=el.value===""?"":Number(el.value);
    else out[f.k]=el.value;
  });
  return out;
}

async function renderEntity(key){
  const def=E[key];
  await Promise.all([list(key,true),...(def.refs||[]).map(r=>list(r,true))]);
  if(def.pre)await def.pre();
  const items=lists[key];
  const c=$("#content");c.innerHTML="";
  const card=document.createElement("div");card.className="card";
  const hd=document.createElement("div");hd.className="hd";
  hd.innerHTML="<h2>"+esc(def.title)+"</h2><div class=sp></div>";
  if(!readOnly){
    if(key==="acme/certificates"){
      hd.appendChild(btn("Request a certificate","pri sm",()=>openCertWizard()));
      hd.appendChild(document.createTextNode(" "));
      hd.appendChild(btn(def.add,"sm",()=>openEditor(key)));
    }else{
      hd.appendChild(btn(def.add,"pri sm",()=>openEditor(key)));
    }
  }
  card.appendChild(hd);
  const bd=document.createElement("div");
  if(!items.length){
    bd.innerHTML='<div class="empty">'+esc(def.intro)+"<br><br>Nothing here yet -- use "+esc(def.add)+" to create the first entry.</div>";
  }else{
    const t=document.createElement("table");
    t.innerHTML="<thead><tr>"+def.cols.map(c=>"<th>"+esc(c[1])+"</th>").join("")+"<th></th></tr></thead>";
    const tb=document.createElement("tbody");
    items.forEach(row=>{
      const tr=document.createElement("tr");
      def.cols.forEach(col=>{
        const td=document.createElement("td");
        td.innerHTML=col[2]?col[2](row):esc(row[col[0]]??"");
        tr.appendChild(td);
      });
      const act=document.createElement("td");act.style.textAlign="right";act.style.whiteSpace="nowrap";
      (readOnly?[]:(def.rowActions||[])).forEach(a=>{
        const b=btn(a.label,"sm "+(a.cls||""),()=>a.fn(row));
        if(a.title)b.title=a.title;
        act.appendChild(b);act.appendChild(document.createTextNode(" "));
      });
      act.appendChild(btn(readOnly?"View":"Edit","sm",()=>openEditor(key,row)));
      if(!readOnly){
      act.appendChild(document.createTextNode(" "));
      act.appendChild(btn("Delete","sm dngr",async()=>{
        if(!confirm("Delete \""+row.name+"\"?"))return;
        try{await api(key+"/"+row.id,"DELETE");await renderEntity(key);refreshStatus();}
        catch(e){alert(e.message);}
      }));}
      tr.appendChild(act);tb.appendChild(tr);
    });
    t.appendChild(tb);bd.appendChild(t);
    const hint=document.createElement("div");hint.className="hint";hint.style.padding="10px 16px";
    hint.textContent=def.intro;bd.appendChild(hint);
  }
  card.appendChild(bd);c.appendChild(card);
}
function openEditor(key,item){
  const def=E[key];
  const frm=document.createElement("div");frm.className="frm";
  def.fields.forEach(f=>fieldRow(f,item?item[f.k]:undefined).forEach(el=>frm.appendChild(el)));
  if(def.editorExtra)def.editorExtra(frm,item);
  const err=document.createElement("div");err.className="err";
  openDlg((item?"Edit ":"New ")+def.title.replace(/s$/,""),frm,[err,
    btn("Cancel","",closeDlg),
    btn("Save","pri",async()=>{
      const data=readForm(def.fields);
      try{
        if(item)await api(key+"/"+item.id,"PUT",Object.assign({},item,data));
        else await api(key,"POST",data);
        closeDlg();await renderEntity(key);refreshStatus();
      }catch(e){err.textContent=e.message;}
    })]);
}

/* which of the health_* rows make sense for each check kind */
const HEALTH_SHOWS={none:[],tcp:["health_interval"],
  http:["health_interval","health_uri","health_status"],
  pgsql:["health_interval","health_user"],mysql:["health_interval","health_user"]};
const CERT_MODE_LABEL={auto:"auto -- reuse one that covers this host",
                       new:"always request a new certificate",
                       none:"no certificate"};

/* Tell the user which certificate a host will end up using, before they commit. */
async function updateCertNote(note){
  const raw=(document.getElementById("f_url")||{}).value||"";
  const mode=(document.getElementById("f_cert_mode")||{}).value||"auto";
  let host="";
  try{host=new URL(raw.includes("://")?raw:"https://"+raw).hostname;}catch(e){}
  if(!host||!raw.trim().toLowerCase().startsWith("https")){note.innerHTML="";return;}
  if(mode==="none"){note.innerHTML='<span class=sub>No certificate will be attached -- the listener still needs one to start TLS.</span>';return;}
  if(mode==="new"){note.innerHTML='<span class=sub>A new certificate will be requested for '+esc(host)+".</span>";return;}
  note.innerHTML='<span class=sub>Checking for an existing certificate...</span>';
  try{
    const r=await api("acme/cover?host="+encodeURIComponent(host));
    if(r.covered){
      const cls=CERT_STATUS[r.status]?CERT_STATUS[r.status][0]:"off";
      note.innerHTML='<span class="pill '+cls+'">'+esc(r.how==="wildcard"?"wildcard match":"exact match")+"</span> "+
        "Will reuse <b>"+esc(r.name)+"</b> <span class=mono>("+esc(r.domains.join(", "))+")</span>"+
        (r.days_left!==null&&r.days_left!==undefined?" &mdash; expires in "+esc(r.days_left)+" days":"")+
        ". No new certificate will be requested.";
    }else{
      note.innerHTML='<span class=sub>No existing certificate covers '+esc(host)+
        " &mdash; a new one will be requested. Tip: a wildcard certificate for <span class=mono>*."+
        esc(host.split('.').slice(1).join('.'))+"</span> would cover every subdomain at once.</span>";
    }
  }catch(e){note.innerHTML='<span class=sub>'+esc(e.message)+"</span>";}
}

function openWizard(prefill){
  const wrap=document.createElement("div");
  const frm=document.createElement("div");frm.className="frm";
  const rows={};
  WIZ_FIELDS.forEach(f=>{
    const cells=fieldRow(f,prefill?prefill[f.k]:undefined);
    rows[f.k]=cells;
    cells.forEach(el=>frm.appendChild(el));
  });
  wrap.appendChild(frm);
  // friendlier labels than the raw option values
  const sel=frm.querySelector("#f_cert_mode");
  if(sel)[...sel.options].forEach(o=>{o.textContent=CERT_MODE_LABEL[o.value]||o.value;});
  const hsel=frm.querySelector("#f_health");
  if(hsel)[...hsel.options].forEach(o=>{o.textContent=HEALTH_LABEL[o.value]||o.value;});
  const setRow=(k,on)=>{(rows[k]||[]).forEach(el=>{el.style.display=on?"":"none";});};
  const syncRows=()=>{
    const show=HEALTH_SHOWS[hsel?hsel.value:"none"]||[];
    ["health_interval","health_uri","health_status","health_user"].forEach(k=>setRow(k,show.includes(k)));
    setRow("check_port",(hsel?hsel.value:"none")!=="none");

let dnsApis=[],dnsApiByHook={},dnsApiOptions=[],dnsApiNote="";
async function loadDnsApis(){
  if(dnsApis.length)return dnsApis;
  try{
    const r=await api("acme/dnsapi");
    dnsApis=r.hooks||[];dnsApiNote=r.note||"";
    dnsApiByHook={};dnsApis.forEach(h=>{dnsApiByHook[h.hook]=h;});
    dnsApiOptions=dnsApis.map(h=>({value:h.hook,label:h.title+" ("+h.hook+")"}));
  }catch(e){dnsApis=[];dnsApiNote=e.message;}
  return dnsApis;
}
function varList(list){
  return list.map(o=>'<span class=mono>'+esc(o.name)+"</span>"+
    (o.optional?" <span class=sub>(optional)</span>":"")+
    (o.desc?" &mdash; "+esc(o.desc):"")).join("<br>");
}
/* Show what the chosen hook needs, and offer to seed the credentials box. */
function dnsCredentialHelp(frm){
  const sel=frm.querySelector("#f_dns_provider"),creds=frm.querySelector("#f_dns_credentials");
  if(!sel||!creds)return;
  const note=document.createElement("div");note.className="hint";note.style.marginTop="6px";
  creds.parentNode.appendChild(note);
  const render=()=>{
    const h=dnsApiByHook[sel.value.trim()];
    if(!sel.value.trim()){note.innerHTML=dnsApiNote?esc(dnsApiNote):"";return;}
    if(!h){note.innerHTML='<span class=sub>Unknown hook &mdash; it will be passed to acme.sh as typed.</span>';return;}
    let html="<b>"+esc(h.title)+"</b> needs:<br>"+(h.options.length?varList(h.options):"<span class=sub>no credentials</span>");
    if(h.options_alt.length)html+="<br><i>or instead:</i><br>"+varList(h.options_alt);
    if(h.docs)html+='<br><a href="'+esc(h.docs.startsWith("http")?h.docs:"https://"+h.docs)+'" target="_blank" rel="noopener">documentation</a>';
    note.innerHTML=html;
    const need=(h.options.length?h.options:h.options_alt).filter(o=>!o.optional);
    if(need.length){
      const b=btn("Fill in the variable names","sm",()=>{
        const have=creds.value.split("\n").map(l=>l.split("=")[0].trim()).filter(Boolean);
        const add=need.filter(o=>!have.includes(o.name)).map(o=>o.name+"=");
        if(add.length)creds.value=(creds.value.trim()?creds.value.replace(/\s*$/,"")+"\n":"")+add.join("\n")+"\n";
      });
      b.style.marginTop="8px";note.appendChild(document.createElement("br"));note.appendChild(b);
    }
  };
  sel.addEventListener("change",render);sel.addEventListener("blur",render);render();
}

      act.appendChild(document.createTextNode(" "));
      act.appendChild(btn("Sync","sm",async()=>{
        out.textContent="pushing...";

    'sync loop. It also hands each node the membership list, including a way back to this one, so you only maintain '+
    'the list here.</p>';

/* ============================ keepalived diagnostics ============================ */
let kaDiag=null,kaIfaceOptions=[];
async function loadKeepalivedDiag(){
  try{
    kaDiag=await api("keepalived/status");
    kaIfaceOptions=(kaDiag.interfaces||[]).filter(i=>i.name!=="lo")
      .map(i=>({value:i.name,label:i.name+(i.addresses.length?" ("+i.addresses.join(", ")+")":" (no address)")}));
  }catch(e){kaDiag=null;kaIfaceOptions=[];}
  return kaDiag;
}
function keepalivedDiagCard(){
  const card=document.createElement("div");card.className="card";
  card.innerHTML='<div class=hd><h2>This node right now</h2></div>';
  const bd=document.createElement("div");bd.className="bd";
  const d=kaDiag;
  if(!d){bd.innerHTML='<p class=hint>Diagnostics are unavailable.</p>';card.appendChild(bd);return card;}

  /* Name the fault outright rather than making it a reading exercise. */
  const problems=[];
  if(d.enabled){
    if(!d.interface_exists)
      problems.push("Interface <span class=mono>"+esc(d.interface||"(unset)")+"</span> does not exist on this node. "+
        "Available: <span class=mono>"+esc((d.interfaces||[]).map(i=>i.name).filter(n=>n!=="lo").join(", ")||"none")+
        "</span>. Keepalived exits with a config error when the interface is wrong, so no node takes the VIP.");
    if(d.validation&&d.validation.ran&&d.validation.ok===false)
      problems.push("Keepalived rejects the configuration this node would write, so Apply leaves "+
        "<span class=mono>"+esc(d.config_path)+"</span> untouched. See the output below.");
    if(!d.config_present)
      problems.push("<span class=mono>"+esc(d.config_path)+"</span> does not exist, so keepalived.service "+
        "never starts (its unit has ConditionFileNotEmpty). Fix the configuration above, then press Apply.");
    if(d.service!=="active"&&d.config_present)
      problems.push("keepalived.service is <b>"+esc(d.service)+"</b>.");
    if(!d.vips.length)
      problems.push("No virtual IP is configured, so there is nothing to take over.");
    if(d.service==="active"&&d.interface_exists&&d.vips.length&&!d.vip_held.length)
      problems.push("Keepalived is running but this node holds no VIP. If the peer holds it, this node is "+
        "correctly passive. If <b>neither</b> node holds it, the two are not seeing each other's VRRP: "+
        "check that every node uses the same virtual router ID, and that they list each other under "+
        "Other nodes -- unicast addresses are derived from that list.");
  }
  const pill=(v,good)=>'<span class="pill '+(good?"up":v==="disabled"?"off":"down")+'">'+esc(v)+"</span>";
  bd.innerHTML='<div class=grid style="margin-bottom:14px">'+
    '<div class=stat><div class=k>Keepalived</div><div class="v" style="font-size:13px">'+pill(d.service,d.service==="active")+"</div></div>"+
    '<div class=stat><div class=k>Interface</div><div class="v" style="font-size:13px">'+
      (d.interface?pill(d.interface,d.interface_exists):'<span class="pill off">unset</span>')+"</div></div>"+
    '<div class=stat><div class=k>VRRP state</div><div class="v" style="font-size:13px">'+
      (d.vrrp_state?pill(d.vrrp_state,d.vrrp_state==="MASTER"):'<span class="pill off">unknown</span>')+"</div></div>"+
    '<div class=stat><div class=k>Virtual IPs held</div><div class="v" style="font-size:13px">'+
      (d.vips.length?d.vips.map(v=>esc(v)+(d.vip_held.includes(v)?' <span class="pill up">here</span>'
                                                                 :' <span class="pill off">elsewhere</span>')).join("<br>")
                    :'<span class=sub>none configured</span>')+"</div></div>"+
    '<div class=stat><div class=k>Config file</div><div class="v" style="font-size:13px">'+
      (d.config_present?'<span class="pill up">written</span>':'<span class="pill down">missing</span>')+"</div></div>"+
    '<div class=stat><div class=k>VRID / priority</div><div class=v style="font-size:13px">'+
      esc(d.vrid)+" / "+esc(d.priority)+"</div></div></div>";
  problems.forEach(p=>{
    const el=document.createElement("div");el.className="hint";el.style.marginBottom="8px";
    el.innerHTML="! "+p;bd.appendChild(el);
  });
  if(!problems.length&&d.enabled){
    const el=document.createElement("div");el.className="hint";
    el.textContent=d.vip_held.length?"This node holds the virtual IP: it is the active one."
                                    :"Nothing looks wrong here.";
    bd.appendChild(el);
  }
  const uni=document.createElement("div");uni.className="hint";uni.style.marginBottom="10px";
  uni.innerHTML=(d.unicast_peer&&d.unicast_peer.length)
    ? "VRRP transport: <b>unicast</b> from <span class=mono>"+esc(d.unicast_src||"the interface address")+
      "</span> to <span class=mono>"+d.unicast_peer.map(esc).join("</span>, <span class=mono>")+
      "</span>. Managed automatically from the node list -- there is nothing to set."
    : "VRRP transport: <b>multicast</b>. Add the other nodes under Other nodes and press Apply, and "+
      "this node switches to unicast automatically, which is what most networks need.";
  bd.appendChild(uni);
  const row=document.createElement("div");row.style.marginTop="14px";
  row.appendChild(btn("Refresh addresses from the other nodes","sm",async()=>{
    uni.textContent="Asking each node for the address on its VRRP interface...";
    try{
      const r=await api("cluster/unicast/apply","POST",{});
      uni.innerHTML=(r.steps||[]).map(x=>"&#10003; "+esc(x)).join("<br>")+
        (r.warnings||[]).map(w=>'<div style="margin-top:6px">! '+esc(w)+"</div>").join("")+
        (r.error?'<div style="margin-top:6px">! '+esc(r.error)+"</div>":"")+
        (r.note?'<div style="margin-top:6px">'+esc(r.note)+"</div>":"");
    }catch(e){uni.textContent=e.message;}
  }));
  row.appendChild(document.createTextNode(" "));
  if(d.validation&&d.validation.output)
    row.appendChild(btn("Show keepalived -t output","sm",()=>showText("keepalived -t",d.validation.output)));
  if(d.log){
    row.appendChild(document.createTextNode(" "));
    row.appendChild(btn("Show the keepalived log","sm",()=>showText("journalctl -u keepalived",d.log)));
  }
  row.appendChild(document.createTextNode(" "));
  row.appendChild(btn("Refresh","sm",async()=>{await loadKeepalivedDiag();route();}));
  bd.appendChild(row);card.appendChild(bd);return card;
}

/* ============================ certificate wizard ============================ */
const NEWOPT="__new__";
const CERT_WIZ=[
 {k:"domains",l:"Domain names",t:"textarea",h:"One per line. The first is the certificate's primary name. A wildcard such as *.iothing.net needs DNS-01."},
 {k:"name",l:"Certificate name",t:"text",h:"Optional -- taken from the first domain when left empty"},
 {k:"account_id",l:"ACME account",t:"select",o:[]},
 {k:"acc_name",l:"New account name",t:"text"},
 {k:"acc_email",l:"E-mail address",t:"text",h:"Where the CA sends expiry warnings"},
 {k:"acc_ca",l:"Certificate authority",t:"select",o:["letsencrypt","letsencrypt_test","zerossl","buypass","google"],d:"letsencrypt",
  h:"letsencrypt_test issues untrusted certificates but has no rate limits -- ideal while setting things up"},
 {k:"acc_eab_kid",l:"EAB key ID",t:"text",h:"Only for ZeroSSL and Google"},
 {k:"acc_eab_hmac",l:"EAB HMAC key",t:"password"},
 {k:"challenge_id",l:"Challenge type",t:"select",o:[]},
 {k:"ch_name",l:"New challenge name",t:"text"},
 {k:"ch_method",l:"Validation method",t:"select",o:["http01","dns01"],d:"http01",
  h:"HTTP-01 needs port 80 reachable from the internet. DNS-01 works behind a firewall and is the only way to get a wildcard."},
 {k:"dns_provider",l:"DNS API hook",t:"combo",o:()=>dnsApiOptions,h:"The provider acme.sh should talk to"},
 {k:"dns_credentials",l:"DNS API credentials",t:"textarea",h:"One KEY=value per line"},
 {k:"key_type",l:"Key type",t:"select",o:["ec-256","ec-384","rsa-2048","rsa-4096"],d:"ec-256"},
 {k:"auto_renew",l:"Renew automatically",t:"bool",d:true},
 {k:"issue",l:"Request it now",t:"bool",d:true,h:"Runs acme.sh straight away; leave off to just create the objects"},
];
async function openCertWizard(){
  await Promise.all([list("acme/accounts",true),list("acme/challenges",true),loadDnsApis()]);
  const accounts=lists["acme/accounts"]||[],challenges=lists["acme/challenges"]||[];
  const fields=CERT_WIZ.map(f=>{
    if(f.k==="account_id")return Object.assign({},f,{o:accounts.map(a=>({value:a.id,label:a.name+" ("+(a.ca||"letsencrypt")+")"})).concat([{value:NEWOPT,label:"Create a new account..."}])});
    if(f.k==="challenge_id")return Object.assign({},f,{o:challenges.map(c=>({value:c.id,label:c.name+" ("+(c.method||"http01")+")"})).concat([{value:NEWOPT,label:"Create a new challenge type..."}])});
    return f;
  });
  const wrap=document.createElement("div");
  const frm=document.createElement("div");frm.className="frm";
  const rows={};
  fields.forEach(f=>{const cells=fieldRow(f,f.k==="account_id"&&!accounts.length?NEWOPT
                                          :f.k==="challenge_id"&&!challenges.length?NEWOPT:undefined);
    rows[f.k]=cells;cells.forEach(el=>frm.appendChild(el));});
  wrap.appendChild(frm);
  const out=document.createElement("div");out.style.marginTop="16px";wrap.appendChild(out);
  const err=document.createElement("div");err.className="err";

  const setRow=(k,on)=>{(rows[k]||[]).forEach(el=>{el.style.display=on?"":"none";});};
  const sync=()=>{
    const newAcc=frm.querySelector("#f_account_id").value===NEWOPT;
    ["acc_name","acc_email","acc_ca","acc_eab_kid","acc_eab_hmac"].forEach(k=>setRow(k,newAcc));
    const newCh=frm.querySelector("#f_challenge_id").value===NEWOPT;
    const method=frm.querySelector("#f_ch_method").value;
    ["ch_name","ch_method"].forEach(k=>setRow(k,newCh));
    ["dns_provider","dns_credentials"].forEach(k=>setRow(k,newCh&&method==="dns01"));
  };
  ["f_account_id","f_challenge_id","f_ch_method"].forEach(id=>{
    const el=frm.querySelector("#"+id);if(el)el.addEventListener("change",sync);});
  dnsCredentialHelp(frm);
  sync();

  const read=()=>{
    const d=readForm(fields);
    const body={domains:d.domains,name:d.name,key_type:d.key_type,
                auto_renew:d.auto_renew,issue:d.issue};
    body.account=d.account_id===NEWOPT
      ? {name:d.acc_name||("account-"+(d.acc_ca||"letsencrypt")),email:d.acc_email,ca:d.acc_ca,
         eab_kid:d.acc_eab_kid,eab_hmac:d.acc_eab_hmac}
      : {id:d.account_id};
    body.challenge=d.challenge_id===NEWOPT
      ? {name:d.ch_name||(d.ch_method==="dns01"?("dns-"+(d.dns_provider||"01")):"http-01"),
         method:d.ch_method,dns_provider:d.dns_provider,dns_credentials:d.dns_credentials}
      : {id:d.challenge_id};
    return body;
  };
  const show=(r,saved)=>{
    out.innerHTML="";
    const box=document.createElement("div");box.className="card";box.style.margin="0";
    box.innerHTML='<div class=hd><h2>'+(saved?"Done":"What this will create")+'</h2></div>'+
      '<div class=bd><div class=mono style="margin-bottom:10px">'+esc((r.domains||[]).join(", "))+"</div>"+
      "<table><tbody>"+(r.actions||[]).map(a=>"<tr><td style='width:90px'><span class='pill "+
        (a.action==="created"?"up":a.action==="updated"?"warn":"off")+"'>"+esc(a.action)+"</span></td><td>"+
        esc(a.type)+"</td><td class=mono>"+esc(a.name)+"</td></tr>").join("")+"</tbody></table>"+
      (r.warnings||[]).map(w=>'<div class=hint style="margin-top:10px">! '+esc(w)+"</div>").join("")+
      (r.issued?('<div style="margin-top:12px">'+(r.issued.ok
          ?'<span class="pill up">issued</span> The certificate is deployed.'
          :'<span class="pill down">failed</span> '+esc(r.issued.error||""))+"</div>"):"")+"</div>";
    if(r.issued&&r.issued.log){
      const b=btn("Show the acme.sh log","sm",()=>showText("acme.sh",r.issued.log));
      b.style.margin="0 16px 16px";box.appendChild(b);
    }
    out.appendChild(box);
  };

  const prev=btn("Preview","",async()=>{
    err.textContent="";
    try{show(await api("wizard/certificate","POST",Object.assign(read(),{dry_run:true,issue:false})),false);}
    catch(e){err.textContent=e.message;}
  });
  const go=btn("Create","pri",async()=>{
    err.textContent="";go.disabled=true;prev.disabled=true;
    const body=read();
    if(body.issue)show({domains:(body.domains||"").split(/[\s,]+/).filter(Boolean),actions:[],
                        warnings:["Running acme.sh -- this can take a minute."]},false);
    try{
      const r=await api("wizard/certificate","POST",body);
      show(r,true);
      lists["acme/accounts"]=null;lists["acme/challenges"]=null;
      await route();refreshStatus();
    }catch(e){err.textContent=e.message;go.disabled=false;prev.disabled=false;}
  });
  openDlg("Request a certificate",wrap,[err,btn("Close","",closeDlg),prev,go]);
}

/* ============================ live statistics ============================ */
const ST_PILL={UP:"up",OPEN:"up",DOWN:"down",MAINT:"warn",DRAIN:"warn",NOLB:"warn"};
function statusPill(v){
  const head=String(v||"").split(" ")[0].replace(/^\d+\//,"");   // "UP 2/3" -> "UP"
  const cls=ST_PILL[head]||"off";
  return '<span class="pill '+cls+'">'+esc(v||"—")+"</span>";
}
function num(v){const n=Number(v);return isNaN(n)?(v||"0"):n.toLocaleString();}
function bytes(v){
  let n=Number(v)||0;const u=["B","kB","MB","GB","TB"];let i=0;
  while(n>=1024&&i<u.length-1){n/=1024;i++;}
  return (i?n.toFixed(1):n)+" "+u[i];
}
function since(sec){
  let n=Number(sec);if(isNaN(n)||n<0)return "—";
  if(n<60)return n+"s";if(n<3600)return Math.floor(n/60)+"m";
  if(n<86400)return Math.floor(n/3600)+"h";return Math.floor(n/86400)+"d";
}
async function renderStats(){
  const c=$("#content");
  let st;
  try{st=await api("stats");}catch(e){c.innerHTML='<div class="card"><div class="bd">'+esc(e.message)+"</div></div>";return;}

/* Poll the log while the updater runs; the service restarts underneath us. */
function watchUpdate(msg){
  const tick=async()=>{
    let alive=true;
    try{
      const l=await api("update/log");
      const pre=document.getElementById("updlog");
      if(pre&&l.log)pre.textContent=l.log;
      if(!l.running){
        alive=false;
        msg.innerHTML="Update finished &mdash; now running <b>"+esc(l.version)+"</b>. Reload the page.";
      }
    }catch(e){msg.textContent="Service is restarting...";}   // expected mid-update
    if(alive)pageTimer=setTimeout(tick,3000);
  };
  pageTimer=setTimeout(tick,3000);
}

/* ============================ certificate status ============================ */
/* Per-certificate state comes from /api/status, keyed by certificate id. */
let certStat={};
async function loadCertStatus(){
  try{const st=await api("status");certStat={};(st.certs||[]).forEach(c=>{certStat[c.id]=c;});}
  catch(e){certStat={};}
}
const CERT_STATUS={
  valid:      ["up",  "valid"],
  expiring:   ["warn","expires soon"],
  expired:    ["down","expired"],
  placeholder:["warn","placeholder"],
  missing:    ["off", "not issued"],
  unreadable: ["down","unreadable"],
  unknown:    ["off", "unknown"],
};
function certStatusCell(r){
  const s=certStat[r.id];
  if(!s)return '<span class="pill off">unknown</span>';
  const [cls,label]=CERT_STATUS[s.status]||["off",s.status];
  let h='<span class="pill '+cls+'">'+esc(label)+"</span>";
  if(s.status==="placeholder")h+='<div class=sub>self-signed stand-in — press Issue</div>';
  else if(s.status==="missing")h+='<div class=sub>no PEM on disk yet</div>';
  if(s.auto_renew===false)h+='<div class=sub>auto-renew off</div>';
  return h;
}
function fmtTime(t){return esc(String(t||"").replace("T"," ").replace("+00:00"," UTC"));}
function certExpiryCell(r){
  const s=certStat[r.id];
  if(!s||!(s.expires_iso||s.expires))return '<span class=sub>—</span>';
  const d=s.days_left;
  let h='<span class=mono>'+(s.expires_iso?fmtTime(s.expires_iso):esc(s.expires))+"</span>";
  if(d!==null&&d!==undefined){
    const n=Math.abs(d),unit=" day"+(n===1?"":"s");
    h+='<div class=sub>'+(d<0?("expired "+n+unit+" ago"):("in "+d+unit))+"</div>";
  }
  return h;
}
function certLastCell(r){
  const li=(certStat[r.id]||{}).last_issue;
  if(!li)return '<span class=sub>never attempted</span>';
  let h='<span class="pill '+(li.ok?"up":"down")+'">'+(li.ok?"succeeded":"failed")+"</span>"+
        "<div class=sub>"+fmtTime(li.time)+" · "+esc(li.seconds)+"s</div>";
  if(!li.ok&&li.error)h+="<div class=sub>"+esc(li.error)+"</div>";
  return h;
}
async function issueCert(row,force){
  const pre=document.createElement("pre");
  pre.textContent="Requesting a certificate for \""+row.name+"\" ...\n\n"+
    "acme.sh usually needs 10-60 seconds for HTTP-01; DNS-01 can take several minutes\n"+
    "while the TXT record propagates. The result and the full log appear here.";
  openDlg((force?"Force issue: ":"Issue: ")+row.name,pre,[btn("Close","",closeDlg)]);
  try{
    const r=await api("acme/issue/"+row.id,"POST",{force:!!force});
    pre.textContent=(r.ok
        ? "SUCCESS -- certificate issued and written to the HAProxy certificate directory.\nIts Automations have run."
        : "FAILED -- "+(r.error||"unknown error"))+
      "\n\n--- acme.sh log ---\n"+(r.log||"(no output)");
  }catch(e){pre.textContent="FAILED -- "+e.message;}
  if(E[location.hash.replace(/^#\//,"")])await renderEntity("acme/certificates");
  refreshStatus();
}
async function showCertLog(row){
  try{
    const r=await api("acme/log/"+row.id);
    if(!r.ok){showText("Last issuance: "+row.name,r.error);return;}
    const e=r.entry;
    showText("Last issuance: "+row.name,
      (e.ok?"Result: succeeded":"Result: FAILED"+(e.error?" -- "+e.error:""))+
      "\nWhen:   "+String(e.time).replace("T"," ").replace("+00:00"," UTC")+
      "\nTook:   "+e.seconds+"s\n\n--- acme.sh log ---\n"+(e.log||"(no output)"));
  }catch(e){showText("Last issuance: "+row.name,e.message);}
}

    '<div class=stat><div class=k>Keepalived</div><div class=v>'+pill(st.keepalived,["active"])+"</div></div>"+
    '<div class=stat><div class=k>Node role</div><div class=v>'+esc(st.role)+"</div></div>"+
    '<div class=stat><div class=k>Virtual IPs</div><div class=v style="font-size:13px">'+
      (st.vips.length?st.vips.map(v=>esc(v)+(st.vip_held.includes(v)?" ●":"")).join("<br>"):"—")+"</div></div>"+
    '<div class=stat><div class=k>Configuration</div><div class=v style="font-size:13px">'+
      (st.dirty?'<span class="pill" style="background:#f6ecdd;color:var(--drift)">unapplied changes</span>':'<span class="pill up">applied</span>')+"</div></div>"+
    '<div class=stat><div class=k>acme.sh</div><div class=v style="font-size:13px">'+(st.acme_installed?'<span class="pill up">installed</span>':'<span class="pill down">missing</span>')+"</div></div>";
  c.appendChild(grid);

  c.appendChild(await clusterCard());
  c.appendChild(await servicesCard());

  const cc=document.createElement("div");cc.className="card";
  cc.innerHTML='<div class=hd><h2>Certificates</h2><div class=sp></div></div>';
  cc.querySelector(".hd").appendChild(btn("Renew all now","sm",async()=>{
    const pre=document.createElement("pre");
    pre.textContent="Running acme.sh for every auto-renew certificate -- this can take a few minutes.";
    openDlg("Renewing certificates",pre,[btn("Close","",closeDlg)]);
    try{
      const r=await api("acme/renew","POST",{});
      const res=r.results||{};
      const names=Object.keys(res);
      pre.textContent=(names.length?names.map(n=>
          (res[n].ok?"OK      ":"FAILED  ")+n+(res[n].ok?"":" -- "+(res[n].error||"unknown error"))).join("\n")
        :"No certificates have auto-renew enabled.")+
        "\n\nOpen a certificate's Log button for the full acme.sh output.";
      refreshStatus();renderOverview();
    }catch(e){pre.textContent="FAILED -- "+e.message;}
  }));
  const cb=document.createElement("div");
  if(!st.certs.length)cb.innerHTML='<div class=empty>No certificates defined. Create them under ACME &gt; Certificates.</div>';
  else{
    st.certs.forEach(x=>{certStat[x.id]=x;});
    cb.innerHTML="<table><thead><tr><th>Name</th><th>Status</th><th>Expires</th><th>Issuer</th><th>Last issue</th></tr></thead><tbody>"+
      st.certs.map(x=>"<tr><td>"+esc(x.name)+"<div class=sub>"+esc((x.domains||[]).join(", "))+"</div></td>"+
        "<td>"+certStatusCell(x)+"</td>"+
        "<td>"+certExpiryCell(x)+"</td>"+
        "<td class=mono style=font-size:11.5px>"+esc(x.issuer||"—")+"</td>"+
        "<td>"+certLastCell(x)+"</td></tr>").join("")+
      "</tbody></table>"+
      '<div class=hint style="padding:10px 16px">Manage and issue them under ACME &gt; Certificates.</div>';
  }
  cc.appendChild(cb);c.appendChild(cc);

  const pv=document.createElement("div");pv.className="card";
  pv.innerHTML='<div class=hd><h2>Generated configuration</h2><div class=sp></div></div>';
  const hd=pv.querySelector(".hd");
  hd.appendChild(btn("Preview haproxy.cfg","sm",async()=>{const p=await api("preview");showText("haproxy.cfg (preview)",p.haproxy);}));
  hd.appendChild(document.createTextNode(" "));
  hd.appendChild(btn("Preview keepalived.conf","sm",async()=>{const p=await api("preview");showText("keepalived.conf (preview)",p.keepalived);}));
  const pb=document.createElement("div");pb.className="bd";
  pb.innerHTML='<p class=hint>Apply validates the rendered haproxy.cfg (haproxy -c) before writing anything, then reloads HAProxy'+
    ' and Keepalived. The previous files are kept as .bak.</p>';
  pv.appendChild(pb);c.appendChild(pv);
}

/* ============================ shell ============================ */
const NAV=[
 ["","Overview",null],
 ["p:services","Services"],
 ["p:stats","Statistics"],
 ["p:cluster","Cluster"],
 ["grp","CERTIFICATES"],
 ["acme/certificates","Certificates"],
 ["acme/accounts","ACME Accounts"],
 ["acme/challenges","Challenge Types"],
 ["grp","SYSTEM"],
 ["p:webui","Web UI access"],
 ["p:backup","Backup & Export"],
 ["p:admin","Administrator login"],
 ["p:updates","Version & updates"],
 ["grp","ADVANCED · HAPROXY","collapse"],
 ["haproxy/frontends","Public Services"],
 ["haproxy/backends","Backend Pools"],
 ["haproxy/servers","Real Servers"],
 ["haproxy/conditions","Conditions"],
 ["haproxy/rules","Rules"],
 ["haproxy/healthchecks","Health Monitors"],
 ["s:haproxy-settings","Settings"],
 ["grp","ADVANCED · ACME","collapse"],
 ["acme/automations","Automations"],
 ["s:acme-settings","Settings"],
];
/* pages with a hand-written renderer (neither CRUD nor a settings form) */
const P={services:renderServices,stats:renderStats,backup:renderBackup,admin:renderAdmin,
         updates:renderUpdates,webui:renderWebui,cluster:renderCluster};
let pageTimer=null;      // per-page refresh timer, cleared whenever we navigate
/* Collapsed groups are remembered, so the nav stays how you left it. */
function openGroups(){
  try{return JSON.parse(localStorage.getItem("ham_nav_open")||"[]");}catch(e){return [];}
}
function setGroupOpen(label,on){
  const cur=openGroups().filter(x=>x!==label);
  if(on)cur.push(label);
  try{localStorage.setItem("ham_nav_open",JSON.stringify(cur));}catch(e){}
}
function toggleGroup(head,on){
  const body=head.nextElementSibling;
  const open=on!==undefined?on:head.getAttribute("aria-expanded")!=="true";
  head.setAttribute("aria-expanded",open?"true":"false");
  body.hidden=!open;
  setGroupOpen(head.dataset.group,open);
}
function buildNav(){
  const n=$("#navlinks");
  const remembered=openGroups();
  let bucket=null;                       // where following items go
  NAV.forEach(([key,label,opt])=>{
    if(key==="grp"){
      if(opt!=="collapse"){
        const g=document.createElement("div");g.className="grp";g.textContent=label;
        n.appendChild(g);bucket=null;return;
      }
      const head=document.createElement("button");
      head.className="grp";head.type="button";head.dataset.group=label;
      head.innerHTML='<span class=caret>&#9656;</span><span>'+esc(label)+"</span><span class=count></span>";
      const body=document.createElement("div");body.className="grp-body";
      head.setAttribute("aria-expanded","false");body.hidden=true;
      head.onclick=()=>toggleGroup(head);
      n.appendChild(head);n.appendChild(body);
      bucket=body;
      if(remembered.includes(label))toggleGroup(head,true);
      return;
    }
    const a=document.createElement("a");a.className="item";a.href="#/"+key;a.textContent=label;a.dataset.key=key;
    (bucket||n).appendChild(a);
    if(bucket){
      const c=bucket.previousElementSibling.querySelector(".count");
      c.textContent=bucket.querySelectorAll("a").length;
    }
  });
}
async function route(){
  if(pageTimer){clearTimeout(pageTimer);pageTimer=null;}
  const key=location.hash.replace(/^#\//,"");
  document.querySelectorAll("#nav a.item").forEach(a=>{
    const on=a.dataset.key===key;
    a.classList.toggle("on",on);
    // a deep link into a collapsed group should not leave it hidden
    if(on){
      const body=a.closest(".grp-body");
      if(body&&body.hidden)toggleGroup(body.previousElementSibling,true);
    }
  });
  const entry=NAV.find(x=>x[0]===key)||NAV[0];
  $("#pagetitle").textContent=entry[1];
  try{
    if(key.startsWith("s:"))await renderSettings(key.slice(2));
    else if(key.startsWith("p:"))await P[key.slice(2)]();
    else if(E[key])await renderEntity(key);
    else await renderOverview();
  }catch(e){
    $("#content").innerHTML='<div class="card"><div class="bd">'+esc(e.message)+"</div></div>";
  }
}
async function refreshStatus(){
  try{
    const st=await api("status");
    $("#brandhost").textContent=st.hostname+(st.version?" · v"+st.version:"");
    const ns=$("#nodestrip");ns.innerHTML="";
    const role=document.createElement("span");
    role.className="chip role-"+st.role;role.textContent=st.role.toUpperCase()+(st.vip_held.length?" · "+st.vip_held[0]:"");
    ns.appendChild(role);
    if(st.dirty){const d=document.createElement("span");d.className="chip drift";d.textContent="unapplied changes";ns.appendChild(d);}
    if(st.update_available){
      const u=document.createElement("a");u.className="chip drift";u.href="#/p:updates";
      u.style.textDecoration="none";u.textContent="v"+st.latest_version+" available";
      ns.appendChild(u);
    }
    renderBanner(st);
    $("#applybtn").classList.toggle("warn",st.dirty);
    $("#applybtn").classList.toggle("pri",!st.dirty);
  }catch(e){/* not fatal */}
}
async function doApply(){
  const b=$("#applybtn");b.disabled=true;b.textContent="Applying...";
  try{
    const r=await api("apply","POST",{});
    const warn=r.warnings||[];
    let text="";
    if(!r.ok)text+="FAILED: "+(r.error||"")+"\n\n";
    else if(warn.length)text+="HAProxy was applied, but something else needs attention:\n\n";
    else text+="Applied.\n\n";
    if(warn.length)text+=warn.map(w=>"!! "+w).join("\n\n")+"\n\n";
    text+=(r.steps||[]).map(s=>"* "+s).join("\n")+
      "\n\n--- haproxy -c output ---\n"+(r.haproxy_check||"(none)")+
      (r.keepalived_check?"\n\n--- keepalived -t output ---\n"+r.keepalived_check:"");
    showText(!r.ok?"Apply failed":warn.length?"Applied with problems":"Configuration applied",text);
  }catch(e){showText("Apply failed",e.message);}
  b.disabled=false;b.textContent="Apply";
  refreshStatus();
  if(!location.hash||location.hash==="#/")route();
}

buildNav();
$("#applybtn").onclick=doApply;
window.addEventListener("hashchange",route);
let readOnly=false;
function renderBanner(st){
  const b=$("#banner");
  readOnly=!!(st&&st.read_only);
  const unlocked=!!(st&&st.edit_override);
  if(!readOnly&&!unlocked){b.innerHTML="";return;}
  b.innerHTML="";
  const box=document.createElement("div");box.className="ro";
  const txt=document.createElement("div");
  txt.innerHTML=readOnly
    ? "<b>Read-only: this node is passive</b>"+esc(st.read_only_reason||"")
    : "<b>Editing is unlocked on this passive node</b>Another node holds the virtual IP. "+
      "Anything changed here will be overwritten the next time that node pushes, so make the "+
      "change there once it is reachable again.";
  box.appendChild(txt);
  const act=readOnly
    ? btn("Edit here anyway","sm",async()=>{
        if(!confirm("Allow editing the shared configuration on this passive node?\n\n"+
                    "Use this when no node holds the virtual IP, or when you are deliberately "+
                    "working here. Whatever you change must still be pushed to the others, and "+
                    "the active node's copy will overwrite this one if it pushes first.\n\n"+
                    "This lasts for this sign-in only: logging out or back in locks it again."))return;
        try{await api("unlock","POST",{on:true});refreshStatus();route();}
        catch(e){alert(e.message);}
      })
    : btn("Lock again","sm",async()=>{
        try{await api("unlock","POST",{on:false});refreshStatus();route();}
        catch(e){alert(e.message);}
      });
  act.style.marginLeft="auto";act.style.whiteSpace="nowrap";
  box.appendChild(act);b.appendChild(box);
}
let ticking=false;
function boot(){
  route();refreshStatus();
  if(!ticking){ticking=true;setInterval(refreshStatus,10000);}
}
(async function start(){
  await refreshWho();
  if(who.needs_setup){showLogin(true);return;}      // first run: create an administrator
  if(!who.authenticated){showLogin(false);return;}
  boot();                                           // no hash => Overview
  maybeSetupWizard();                               // fresh install => offer the setup wizard
})();
</script>
