name: Build .deb and .rpm

# Builds both packages, installs each one on a real systemd host of the family
# it targets, and checks the UI answers before the run passes. On a tag the
# packages are attached to the release.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attaching packages to a release
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: echo "value=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Vendor acme.sh
        run: |
          set -eu
          ACME=$(grep -oP 'ACME_VERSION=\K[0-9.]+' Dockerfile | head -1)
          curl -fsSL "https://github.com/acmesh-official/acme.sh/archive/refs/tags/${ACME}.tar.gz" -o /tmp/acme.tgz
          mkdir -p dist/acme.sh
          tar -xzf /tmp/acme.tgz -C dist/acme.sh --strip-components=1
          echo "vendored acme.sh $ACME"

      - name: Build the packages
        run: |
          set -eu
          for fmt in deb rpm; do
            docker run --rm -v "$PWD":/w -w /w -e VERSION="${{ steps.version.outputs.value }}" \
              goreleaser/nfpm:latest package -f packaging/nfpm.yaml -p "$fmt" -t dist/
          done
          ls -la dist/*.deb dist/*.rpm

      # A package that does not contain exactly what the repository contains is
      # worse than a build failure, because it installs and then misbehaves. A
      # truncated app.py once produced a service that started, exited zero and
      # said nothing at all.
      - name: Check the packages contain the real files
        run: |
          set -eu
          mkdir -p /tmp/x && dpkg-deb -x dist/*.deb /tmp/x
          for f in app.py static/index.html VERSION $(sed 's|^|ham/|' ham/FILES); do
            cmp "/tmp/x/opt/haproxy-manager/$f" "$f" \
              || { echo "packaged $f differs from the source"; exit 1; }
          done
          grep -q '^if __name__' /tmp/x/opt/haproxy-manager/app.py
          # app.py is a few lines now; what it starts has to be in there too,
          # and has to parse rather than merely be present.
          python3 -c "import ast,pathlib; d=pathlib.Path('/tmp/x/opt/haproxy-manager/ham'); n=[ast.parse(p.read_text()) for p in sorted(d.glob('*.py'))]; print(len(n),'packaged modules parse')"
          echo "the package matches the source"

      # Installing on the distribution itself is the only check that means
      # anything: dependency names and scriptlet behaviour differ per family.
      - name: Install on Debian, Ubuntu, Rocky and Fedora
        run: |
          set -eu
          test_one() {
            base="$1"; fmt="$2"; setup="$3"; tag="systemd-$(echo "$base" | tr ':/' '--')"
            echo "== $base =="
            # The stock images have no init, so build one that does before
            # trying to boot it.
            printf 'FROM %s\nRUN %s\nSTOPSIGNAL SIGRTMIN+3\nCMD ["/sbin/init"]\n' \
              "$base" "$setup" > /tmp/Dockerfile.$tag
            docker build -q -t "$tag" -f /tmp/Dockerfile.$tag /tmp >/dev/null
            cid=$(docker run -d --privileged --cgroupns=host \
                  -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock "$tag")
            for i in $(seq 30); do
              docker exec "$cid" systemctl is-system-running >/dev/null 2>&1 && break
              sleep 2
            done
            # /tmp is often a tmpfs mounted by systemd, which hides anything
            # docker cp wrote into the image layer underneath it.
            if [ "$fmt" = deb ]; then
              docker cp dist/*.deb "$cid":/root/p.deb
              docker exec "$cid" sh -c 'apt-get update -q >/dev/null && apt-get install -y /root/p.deb'
            else
              docker cp dist/*.rpm "$cid":/root/p.rpm
              docker exec "$cid" sh -c 'dnf -y install /root/p.rpm'
            fi
            ok=""
            for i in $(seq 45); do
              if docker exec "$cid" curl -sf -o /dev/null http://127.0.0.1:8080/api/whoami; then ok=1; break; fi
              sleep 2
            done
            [ -n "$ok" ] || { docker exec "$cid" journalctl -u haproxy-manager -n 30 --no-pager; exit 1; }
            docker exec "$cid" sh -c '
              PW=$(awk "/password/{print \$2}" /var/lib/haproxy-manager/admin-credentials.txt)
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8080/api/login \
                     -H "Content-Type: application/json" -d "{\"username\":\"admin\",\"password\":\"$PW\"}")
              echo "   service=$(systemctl is-active haproxy-manager) login=$code"
              [ "$code" = 200 ] || exit 1'
            docker rm -f "$cid" >/dev/null
          }
          # curl is already in the RPM base images (as curl or curl-minimal);
          # installing it again is what made the image build conflict.
          APT='apt-get update -q && apt-get install -y --no-install-recommends systemd systemd-sysv dbus curl ca-certificates && rm -rf /var/lib/apt/lists/*'
          test_one debian:bookworm deb "$APT"
          test_one ubuntu:24.04    deb "$APT"
          test_one rockylinux:9    rpm 'dnf -y install systemd systemd-sysv epel-release && dnf clean all'
          test_one fedora:41       rpm 'dnf -y install systemd && dnf clean all'

      - name: Keep the packages as build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.version.outputs.value }}
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 90

      # Only adds what is missing. Re-uploading assets that are already on the
      # release deletes and replaces them, and a transient failure part-way
      # through then leaves the release short of a package.
      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # A tag does not imply a release: releases are cut deliberately, and
          # most tags never get one. Nothing to attach to is not a failure.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release for $TAG -- the packages are on this run as artifacts"
            exit 0
          fi
          have=$(gh release view "$TAG" --json assets --jq '.assets[].name' || true)
          for f in dist/*.deb dist/*.rpm; do
            if printf '%s\n' "$have" | grep -qx "$(basename "$f")"; then
              echo "already on the release: $(basename "$f")"
            else
              gh release upload "$TAG" "$f"
            fi
          done
