[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

# /dev/log -> container stdout *and* a file. There is no journal in the image,
# so the file is what the UI's log viewer reads back for HAProxy and Keepalived.
[program:syslog]
command=/usr/bin/python3 /usr/local/bin/ham-syslogd
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:manager]
command=/usr/bin/python3 /opt/haproxy-manager/app.py
directory=/opt/haproxy-manager
autostart=true
autorestart=true
startretries=3
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:haproxy]
command=/usr/local/bin/haproxy-run
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=20
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# Started on demand by the app (Cluster > Apply, or the watchdog), which
# calls `systemctl reload-or-restart keepalived` once a config has been written.
# Needs NET_ADMIN/NET_BROADCAST/NET_RAW and, in practice, host networking.
# The CrowdSec SPOA bouncer. Not started with the container: the app starts
# it (through the systemctl shim) once CrowdSec is switched on, and stops it
# when it is switched off. Logs to stdout, the app's configuration says so.
# Through a loop (docker/crowdsec-run): the bouncer halts when the LAPI
# cannot be reached, and supervisord's own retries give up too soon.
[program:crowdsec-spoa-bouncer]
command=/usr/local/bin/crowdsec-run
user=crowdsec-spoa
autostart=false
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopsignal=TERM
priority=25
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:keepalived]
# no -l: log through syslog so the collector above captures it for the viewer
command=/usr/sbin/keepalived -n -f /etc/keepalived/keepalived.conf
autostart=false
autorestart=true
startsecs=3
stopsignal=TERM
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
