[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

# /dev/log -> container stdout, so HAProxy's `log /dev/log local0` works without
# a syslog daemon in the image.
[program:syslog]
command=/usr/bin/socat -u UNIX-RECV:/dev/log,mode=0666,unlink-early STDOUT
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:manager]
command=/usr/bin/python3 /opt/haproxy-manager/app.py
directory=/opt/haproxy-manager
autostart=true
autorestart=true
startretries=3
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:haproxy]
command=/usr/local/bin/haproxy-run
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=20
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# Started on demand by the app (High Availability > Keepalived > Apply), which
# calls `systemctl reload-or-restart keepalived` once a config has been written.
# Needs NET_ADMIN/NET_BROADCAST/NET_RAW and, in practice, host networking.
[program:keepalived]
command=/usr/sbin/keepalived -n -l -f /etc/keepalived/keepalived.conf
autostart=false
autorestart=true
startsecs=3
stopsignal=TERM
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
